<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Leora Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#D4AF37; --gold-dark:#B68D28; --gold-soft: rgba(212,175,55,0.14);
    --royal:#0B1F3A; --navy:#081626; --surface-dark:#0E1728;
    --ivory:#FAF7F2; --white:#FFFFFF; --text-dark:#111827; --text-light:#F8FAFC;
    --bg: var(--ivory); --bg-elevated: var(--white); --text: var(--text-dark);
    --text-muted: #6B6458; --border: rgba(17,24,39,0.08);
    --card-shadow: 0 1px 2px rgba(17,24,39,0.04), 0 12px 32px -12px rgba(17,24,39,0.10);
  }
  html[data-theme="dark"]{
    --bg: var(--navy); --bg-elevated: var(--surface-dark); --text: var(--text-light);
    --text-muted: #93A0B4; --border: rgba(248,250,252,0.08);
    --card-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 20px 48px -16px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;transition:background .4s ease,color .4s ease;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  h1,h2,h3,.display{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-0.02em;margin:0;}
  p{margin:0;color:var(--text-muted);line-height:1.6;}
  a{color:inherit;text-decoration:none;}
  header{background:color-mix(in srgb, var(--bg) 82%, transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);flex-shrink:0;}
  nav{max-width:1280px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mono{width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,var(--royal),var(--navy));display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:'Plus Jakarta Sans';font-weight:800;font-size:16px;}
  .brand span{font-family:'Plus Jakarta Sans';font-weight:800;font-size:17px;}
  .theme-toggle{width:40px;height:22px;border-radius:20px;background:var(--border);position:relative;cursor:pointer;}
  .theme-toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--gold);transition:transform .3s ease;}
  html[data-theme="dark"] .theme-toggle .knob{transform:translateX(18px);}
  .btn-ghost{padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;}
  .btn-ghost:hover{border-color:var(--gold);}

  .inbox-shell{flex:1;display:flex;max-width:1280px;margin:0 auto;width:100%;overflow:hidden;border-left:1px solid var(--border);border-right:1px solid var(--border);}
  .thread-list{width:320px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;}
  .thread-list-head{padding:16px 18px 10px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);}
  .thread{display:flex;gap:12px;padding:14px 18px;cursor:pointer;border-bottom:1px solid var(--border);}
  .thread:hover, .thread.active{background:var(--gold-soft);}
  .thread .av{width:38px;height:38px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
  .thread .meta{flex:1;min-width:0;}
  .thread .meta h4{font-size:14px;display:flex;justify-content:space-between;gap:8px;}
  .thread .meta h4 time{font-size:11px;font-weight:500;color:var(--text-muted);}
  .thread .meta p{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .thread .unread-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:6px;}

  .thread-view{flex:1;display:flex;flex-direction:column;min-width:0;}
  .thread-view-head{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
  .thread-view-head h3{font-size:16px;}
  .thread-view-head p{font-size:12.5px;}
  .messages-area{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;}
  .msg{max-width:64%;padding:11px 15px;border-radius:14px;font-size:14px;line-height:1.5;}
  .msg.them{background:var(--bg-elevated);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px;}
  .msg.me{background:var(--gold);color:#1a1204;align-self:flex-end;border-bottom-right-radius:4px;}
  .msg time{display:block;font-size:10.5px;margin-top:5px;opacity:.65;}
  .composer{border-top:1px solid var(--border);padding:14px 18px;display:flex;gap:10px;flex-shrink:0;}
  .composer input{flex:1;padding:12px 15px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:'Inter';font-size:14px;outline:none;}
  .composer input:focus{border-color:var(--gold);}
  .composer button{padding:12px 20px;border-radius:12px;background:var(--gold);color:#1a1204;border:none;font-weight:700;cursor:pointer;}
  .composer button:hover{background:var(--gold-dark);}
  .empty-state{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--text-muted);font-size:14px;}
  @media (max-width:760px){ .thread-list{width:100%;} .thread-view{display:none;} }
</style>
</head>
<body>

<header>
  <nav>
    <a class="brand" href="leora-events-homepage.html">
      <div class="mono">L</div>
      <span>Leora Events</span>
    </a>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="theme-toggle" id="themeToggle"><div class="knob"></div></div>
      <a class="btn-ghost" href="dashboard.php">Back to Dashboard</a>
    </div>
  </nav>
</header>

<div class="inbox-shell">
  <div class="thread-list" id="threadList">
    <div class="thread-list-head">Inbox</div>
    <!-- threads injected by JS -->
  </div>
  <div class="thread-view" id="threadView">
    <div class="empty-state">Select a conversation to view messages</div>
  </div>
</div>

<script>
  const toggle = document.getElementById('themeToggle');
  const root = document.documentElement;
  let dark = false;
  toggle.addEventListener('click', ()=>{ dark = !dark; root.setAttribute('data-theme', dark?'dark':'light'); });

  const threads = [
    { id:1, name:'Mesk Studio Photography', sub:'Photo & Video', unread:true, time:'2h', preview:'Thank you for the inquiry! We have Nov 14 available.',
      messages:[
        {from:'them', text:'Hi Selam! Thanks for reaching out about your wedding on Nov 14, 2026.', time:'10:02 AM'},
        {from:'me', text:'Hi! Yes, we love your portfolio. Is the Signature Package available that date?', time:'10:15 AM'},
        {from:'them', text:'Thank you for the inquiry! We have Nov 14 available. Would you like to schedule a call?', time:'10:20 AM'},
      ] },
    { id:2, name:'Enat Catering & Events', sub:'Catering', unread:true, time:'1d', preview:'We can do a tasting session next week.',
      messages:[
        {from:'them', text:'Hello! We received your booking request for 180 guests.', time:'Yesterday'},
        {from:'them', text:'We can do a tasting session next week if you\'d like to try the menu first.', time:'Yesterday'},
      ] },
    { id:3, name:'Zema Live Band', sub:'Entertainment', unread:false, time:'3d', preview:'Sounds great, see you at the venue walkthrough.',
      messages:[
        {from:'me', text:'Can you play both traditional and modern sets?', time:'Mon'},
        {from:'them', text:'Absolutely, that\'s our specialty for Ethiopian weddings.', time:'Mon'},
        {from:'me', text:'Perfect, let\'s do a venue walkthrough together.', time:'Mon'},
        {from:'them', text:'Sounds great, see you at the venue walkthrough.', time:'Mon'},
      ] },
    { id:4, name:'Admin — Leora Support', sub:'Support', unread:false, time:'6d', preview:'Your Premium plan renews on Aug 1.', messages:[
        {from:'them', text:'Your Premium plan renews on Aug 1. Let us know if you have questions.', time:'Last week'},
      ] },
  ];

  const listEl = document.getElementById('threadList');
  threads.forEach(t=>{
    const div = document.createElement('div');
    div.className = 'thread';
    div.dataset.id = t.id;
    div.innerHTML = `
      <div class="av">${t.name.split(' ').map(w=>w[0]).slice(0,2).join('')}</div>
      <div class="meta">
        <h4>${t.name} <time>${t.time}</time></h4>
        <p>${t.preview}</p>
      </div>
      ${t.unread ? '<div class="unread-dot"></div>' : ''}
    `;
    div.addEventListener('click', ()=>openThread(t.id, div));
    listEl.appendChild(div);
  });

  function openThread(id, el){
    document.querySelectorAll('.thread').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    const t = threads.find(x=>x.id===id);
    const view = document.getElementById('threadView');
    view.innerHTML = `
      <div class="thread-view-head">
        <div><h3>${t.name}</h3><p>${t.sub}</p></div>
        <a class="btn-ghost" href="leora-events-marketplace.html">View Profile</a>
      </div>
      <div class="messages-area" id="msgArea">
        ${t.messages.map(m=>`<div class="msg ${m.from==='me'?'me':'them'}">${m.text}<time>${m.time}</time></div>`).join('')}
      </div>
      <div class="composer">
        <input type="text" id="composerInput" placeholder="Type a message...">
        <button onclick="sendMsg(${id})">Send</button>
      </div>
    `;
  }

  function sendMsg(id){
    const input = document.getElementById('composerInput');
    if(!input.value.trim()) return;
    const t = threads.find(x=>x.id===id);
    t.messages.push({from:'me', text: input.value, time:'Now'});
    const area = document.getElementById('msgArea');
    area.innerHTML += `<div class="msg me">${input.value}<time>Now</time></div>`;
    area.scrollTop = area.scrollHeight;
    input.value = '';
  }
</script>
</body>
</html>
